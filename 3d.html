<script type="module">
import * as THREE from "three";
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function toast(msg, ms) { const el = $("toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(toast.t); if (ms) toast.t = setTimeout(() => el.classList.remove("on"), ms); }

// ---------- 렌더러·카메라 ----------
const phone = matchMedia("(pointer: coarse)").matches;
const renderer = new THREE.WebGLRenderer({ antialias: !phone || devicePixelRatio < 2, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, phone ? 1.6 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0d26, .0011);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, .1, 3000);
function fit() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 72 : 55; camera.updateProjectionMatrix(); }   // 세로 화면은 시야를 넓게
fit(); addEventListener("resize", fit);

// 세계 좌표(미터): -z 쪽이 한강, +z 쪽이 도시. 잔디 x -22~22, z 0~16 / 산책로 z -2.2~0 / 물 y -1.2
const WATER_Y = -1.2, LAWN = { x0: -22, x1: 22, z0: -2.2, z1: 16 };
const tex = (cv, rep) => { const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; };
const cvs = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return [c, c.getContext("2d")]; };

// ---------- 하늘 ----------
{
  const m = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: "varying vec3 d; void main(){ d = normalize(position); vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.); gl_Position = p.xyww; }",
    fragmentShader: `varying vec3 d; void main(){ float h = d.y;
      vec3 top = vec3(.012,.02,.09), mid = vec3(.07,.08,.26), hor = vec3(.36,.22,.44);
      float front = smoothstep(.2, -1., d.z) * .35;                                  // 한강 쪽 하늘이 조금 더 보랏빛
      vec3 c = mix(hor * (1. + front), mid, smoothstep(0., .2, h)); c = mix(c, top, smoothstep(.2, .75, h));
      if (h < 0.) c = mix(hor * .45, vec3(.02,.02,.06), smoothstep(0., -.15, h));
      gl_FragColor = vec4(c, 1.); }`,
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(1500, 32, 16), m));
}
// 별: 반짝이는 두 무리 + 은하수 띠
const starSets = [];
{
  const r = rng(5);
  for (let k = 0; k < 3; k++) {
    const n = k === 2 ? 2600 : 700, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      let x, y, z;
      if (k === 2) { const a = r() * TAU, w = (r() + r() + r() - 1.5) * .16; x = Math.cos(a); z = Math.sin(a) * .55 + w; y = Math.abs(Math.sin(a)) * .85 + .12 + w * .5; }   // 은하수: 하늘을 비스듬히 가로지르는 띠
      else { y = .05 + Math.pow(r(), .7) * .95; const a = r() * TAU, rr = Math.sqrt(1 - y * y); x = Math.cos(a) * rr; z = Math.sin(a) * rr; }
      const l = Math.hypot(x, y, z) / 1300; pos.set([x / l, y / l, z / l], i * 3);
      const warm = r(); col.set(warm < .3 ? [1, .88, .75] : warm < .5 ? [.8, .88, 1] : [1, 1, 1], i * 3);
    }
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3)); g.setAttribute("color", new THREE.BufferAttribute(col, 3));
    const mat = new THREE.PointsMaterial({ size: k === 2 ? 1.2 : 2.1, sizeAttenuation: false, vertexColors: true, transparent: true, opacity: k === 2 ? .45 : .9, fog: false, depthWrite: false });
    const p = new THREE.Points(g, mat); scene.add(p); starSets.push(p);
  }
}
// 달
function glowTex(inner, outer) { const [c, g] = cvs(128, 128); const q = g.createRadialGradient(64, 64, 0, 64, 64, 64); q.addColorStop(0, inner); q.addColorStop(.25, inner.replace(/[\d.]+\)$/, ".5)")); q.addColorStop(1, outer); g.fillStyle = q; g.fillRect(0, 0, 128, 128); return tex(c); }
const GLOW = glowTex("rgba(255,226,170,1)", "rgba(255,226,170,0)");
{
  const [c, g] = cvs(256, 256); const q = g.createRadialGradient(128, 128, 30, 128, 128, 128); q.addColorStop(0, "rgba(255,240,210,.35)"); q.addColorStop(1, "rgba(255,240,210,0)"); g.fillStyle = q; g.fillRect(0, 0, 256, 256);
  const q2 = g.createRadialGradient(118, 118, 0, 128, 128, 30); q2.addColorStop(0, "#fffaf0"); q2.addColorStop(1, "#e6dabd"); g.fillStyle = q2; g.beginPath(); g.arc(128, 128, 30, 0, TAU); g.fill();
  g.fillStyle = "rgba(190,175,140,.3)"; [[-10, -6, 7], [8, 6, 9], [3, -13, 4]].forEach(([a, b, r]) => { g.beginPath(); g.arc(128 + a, 128 + b, r, 0, TAU); g.fill(); });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex(c), fog: false, depthWrite: false, transparent: true })); s.position.set(420, 520, -1000); s.scale.set(260, 260, 1); scene.add(s);
}

// ---------- 빛 ----------
scene.add(new THREE.HemisphereLight(0x8090d0, 0x1a1a24, 1.25));
const moonL = new THREE.DirectionalLight(0xb8c4ff, .7); moonL.position.set(30, 40, -60); scene.add(moonL);
const warmL = new THREE.PointLight(0xffd6a0, 40, 34, 1.6); warmL.position.set(0, 7, 6); scene.add(warmL);

// ---------- 건물: 창문 지도 한 장(atlas)에서 건물마다 다른 부분을 잘라 붙여 그리기 호출을 줄인다 ----------
// lit: 켜진 창 비율, off: 통째로 꺼진 구역 비율. 오른쪽 16칸은 항상 다 꺼진 줄(꺼진 건물용)
const CELL = 8, NC = 128;
function windowAtlas(seed, lit, off) {
  const [c, g] = cvs(NC * CELL, NC * CELL), r = rng(seed);
  g.fillStyle = "#0b101d"; g.fillRect(0, 0, c.width, c.height);
  for (let by = 0; by < NC; by += 8) for (let bx = 0; bx < NC; bx += 8) {
    const dark = bx >= NC - 16 || r() < off, rate = lit * (.25 + r() * 1.6), office = r() < .15, hue = r();
    for (let y = by; y < by + 8; y++) { const floorOn = office && r() < .5; for (let x = bx; x < bx + 8; x++) {
      const on = !dark && (floorOn || r() < rate);
      g.fillStyle = on ? (hue < .55 ? `rgb(255,${200 + r() * 30 | 0},${130 + r() * 40 | 0})` : hue < .85 ? `rgb(${225 + r() * 25 | 0},235,255)` : "rgb(160,225,255)") : (r() < .5 ? "#141b2c" : "#111726");
      g.fillRect(x * CELL + 2, y * CELL + 2, 4, 5);
    } }
  }
  const t = tex(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
// 상자 여러 개를 하나로 합친다(위치·uv만)
function boxGeo(w, h, d, x, y, z, faceUV) {
  const b = new THREE.BoxGeometry(w, h, d); b.translate(x, y + h / 2, z);
  const uv = b.attributes.uv;
  for (let f = 0; f < 6; f++) { const fw = f < 2 ? d : w; const m = faceUV(f, fw, h); for (let k = 0; k < 4; k++) { const i = f * 4 + k; uv.setXY(i, m.u0 + uv.getX(i) * m.us, m.v0 + uv.getY(i) * m.vs); } }
  return b;
}
function merge(list) {
  let nv = 0, ni = 0; for (const g of list) { nv += g.attributes.position.count; ni += g.index.count; }
  const pos = new Float32Array(nv * 3), uv = new Float32Array(nv * 2), idx = new Uint32Array(ni); let ov = 0, oi = 0;
  for (const g of list) { pos.set(g.attributes.position.array, ov * 3); uv.set(g.attributes.uv.array, ov * 2); for (let i = 0; i < g.index.count; i++) idx[oi + i] = g.index.array[i] + ov; ov += g.attributes.position.count; oi += g.index.count; g.dispose(); }
  const m = new THREE.BufferGeometry(); m.setAttribute("position", new THREE.BufferAttribute(pos, 3)); m.setAttribute("uv", new THREE.BufferAttribute(uv, 2)); m.setIndex(new THREE.BufferAttribute(idx, 1)); m.computeBoundingSphere(); return m;
}
function cityBlock(r, list, dark, x, z, w, d, h, baseY) {
  const off = r() < dark, u0 = off ? (NC - 15) / NC : Math.floor(r() * (NC - 40)) / NC, v0 = Math.floor(r() * 40) / NC;
  list.push(boxGeo(w, h, d, x, baseY, z, (f, fw, fh) => f === 2 || f === 3 ? { u0: .0005, v0: .9995, us: 0, vs: 0 }
    : { u0: u0 + (f % 2) * .07, v0, us: off ? Math.min(fw / 1.3, 14) / NC : fw / 1.3 / NC, vs: fh / 1.7 / NC }));
}
const aviLights = [];
// 건너편(한강 쪽) 스카이라인: 창이 많이 켜져 있고 LED 띠를 두른 건물 몇 개, 금빛 타워 하나
{
  const r = rng(21), list = [], atlas = windowAtlas(3, .32, .12);
  for (let row = 0; row < 3; row++) {
    let x = -900;
    while (x < 900) {
      const w = 12 + r() * 26, d = 12 + r() * 16, near = row === 2, hh = (near ? 20 : 34) + r() * r() * (near ? 70 : 140);
      const z = -440 - row * 40 - r() * 12, h = Math.abs(x + 200) < 120 && row < 2 ? hh * .5 : hh;
      cityBlock(r, list, .12, x + w / 2, z, w, d, h, -1);
      if (h > 70 && r() < .7) aviLights.push(new THREE.Vector3(x + w / 2, h - 1 + .4, z));
      x += w + r() * 6;
    }
  }
  const geo = merge(list), mat = new THREE.MeshBasicMaterial({ map: atlas });
  scene.add(new THREE.Mesh(geo, mat));
  const mir = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: atlas, side: THREE.DoubleSide, color: 0x4a5478 })); mir.scale.y = -1; mir.position.y = WATER_Y * 2; scene.add(mir);   // 물에 비친 도시
  // 금빛 타워(63빌딩 느낌)
  const [c, g] = cvs(64, 256); const q = g.createLinearGradient(0, 0, 64, 0); q.addColorStop(0, "#7a5520"); q.addColorStop(.45, "#ffd27a"); q.addColorStop(1, "#8a6224"); g.fillStyle = q; g.fillRect(0, 0, 64, 256);
  g.fillStyle = "rgba(255,240,200,.35)"; for (let y = 0; y < 256; y += 6) g.fillRect(0, y, 64, 1);
  const gold = new THREE.MeshBasicMaterial({ map: tex(c) }), tw = new THREE.Mesh(new THREE.BoxGeometry(22, 180, 16), gold); tw.position.set(150, 89, -450); scene.add(tw);
  const tw2 = tw.clone(); tw2.scale.y = -1; tw2.position.y = WATER_Y * 2 - 89; tw2.material = gold.clone(); tw2.material.side = THREE.DoubleSide; tw2.material.color.setHex(0x8a8070); scene.add(tw2);
  aviLights.push(new THREE.Vector3(150, 180, -450));
  // LED 띠
  const ledMat = []; const ledCols = [0xff5ac8, 0x5ad8ff, 0x9a7aff, 0x7affb0];
  for (let i = 0; i < 7; i++) { const m = new THREE.MeshBasicMaterial({ color: ledCols[i % 4] }); ledMat.push(m); const w = 22, h = 70 + r() * 60, x = -650 + i * 200 + r() * 60, z = -442; const b = new THREE.Mesh(new THREE.BoxGeometry(w, 2, 16), m); b.position.set(x, h, z); scene.add(b); const s = b.clone(); s.position.y = h - 6; scene.add(s); }
  window.__led = ledMat;
  // 남산과 타워
  const hill = new THREE.Mesh(new THREE.SphereGeometry(110, 24, 12, 0, TAU, 0, Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x0b1024 })); hill.scale.set(2.6, .9, 1.4); hill.position.set(-300, -1, -900); scene.add(hill);
  const tower = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 2.6, 46, 8), new THREE.MeshBasicMaterial({ color: 0xc8c8d8 })); tower.scale.set(2.2, 2.2, 2.2); tower.position.set(-300, 99 + 50, -900); scene.add(tower);
  const top = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: 0xffd0e0, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true })); top.position.set(-300, 202, -900); top.scale.set(40, 40, 1); scene.add(top);
  aviLights.push(new THREE.Vector3(-300, 200, -900));
}
// 뒤쪽 도시: 건물만, 대부분 꺼진 창(늦은 밤), 몇 개만 켜짐
{
  const r = rng(77), list = [], atlas = windowAtlas(9, .08, .4);
  for (let bz = 0; bz < 5; bz++) for (let bx = -6; bx <= 6; bx++) {
    const cx0 = bx * 26, cz0 = 50 + bz * 28;
    for (let k = 0; k < 2; k++) { const w = 9 + r() * 9, d = 9 + r() * 9, h = 9 + r() * r() * (bz > 1 ? 60 : 28); const x = cx0 + (k ? 6 : -6) + (r() - .5) * 3, z = cz0 + (r() - .5) * 6; cityBlock(r, list, .38, x, z, w, d, h, 0); if (h > 60 && r() < .5) aviLights.push(new THREE.Vector3(x, h + .4, z)); }
  }
  scene.add(new THREE.Mesh(merge(list), new THREE.MeshBasicMaterial({ map: atlas })));
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 200), new THREE.MeshLambertMaterial({ color: 0x15161c })); ground.rotation.x = -Math.PI / 2; ground.position.set(0, -.02, 110); scene.add(ground);
  const road = new THREE.Mesh(new THREE.PlaneGeometry(500, 5), new THREE.MeshLambertMaterial({ color: 0x1d1e25 })); road.rotation.x = -Math.PI / 2; road.position.set(0, .005, 21); scene.add(road);
}
// 항공 장애등(빨강, 깜박)
const avi = new THREE.Points(new THREE.BufferGeometry().setFromPoints(aviLights), new THREE.PointsMaterial({ color: 0xff3a3a, size: 4, sizeAttenuation: false, transparent: true, fog: false }));
scene.add(avi);

// ---------- 강·다리·둑·잔디 ----------
{
  const water = new THREE.Mesh(new THREE.PlaneGeometry(3000, 900), new THREE.MeshBasicMaterial({ color: 0x0a1230, transparent: true, opacity: .88 }));
  water.rotation.x = -Math.PI / 2; water.position.set(0, WATER_Y, -450); scene.add(water);
  const farBank = new THREE.Mesh(new THREE.BoxGeometry(3000, 1, 160), new THREE.MeshBasicMaterial({ color: 0x0c0f1c })); farBank.position.set(0, -1.4, -500); scene.add(farBank);
  // 다리: 상판·교각·가로등 불빛·지나가는 차
  const deckMat = new THREE.MeshLambertMaterial({ color: 0x2a2e3e });
  const deck = new THREE.Mesh(new THREE.BoxGeometry(3000, 2, 10), deckMat); deck.position.set(0, 10, -230); scene.add(deck);
  const piers = []; for (let x = -1400; x <= 1400; x += 60) piers.push(boxGeo(4, 11.2, 5, x, WATER_Y, -230, () => ({ u0: 0, v0: 0, us: 0, vs: 0 })));
  scene.add(new THREE.Mesh(merge(piers), deckMat));
  const bl = []; for (let x = -1400; x <= 1400; x += 14) { bl.push(new THREE.Vector3(x, 12, -225.5)); bl.push(new THREE.Vector3(x + 7, 12, -234.5)); }
  scene.add(new THREE.Points(new THREE.BufferGeometry().setFromPoints(bl), new THREE.PointsMaterial({ color: 0xffd9a0, size: 2.6, sizeAttenuation: false, fog: false })));
  // 둑: 산책로 앞쪽 돌 경사
  const slope = new THREE.Mesh(new THREE.PlaneGeometry(1400, 2.6), new THREE.MeshLambertMaterial({ color: 0x2b303c })); slope.rotation.x = -Math.PI / 2 + .5; slope.position.set(0, -.6, -3.3); scene.add(slope);
  const rail = []; for (let x = -60; x <= 60; x += 2.2) rail.push(boxGeo(.06, .9, .06, x, 0, -2.25, () => ({ u0: 0, v0: 0, us: 0, vs: 0 })));
  rail.push(boxGeo(120, .06, .06, 0, .9, -2.25, () => ({ u0: 0, v0: 0, us: 0, vs: 0 })));
  scene.add(new THREE.Mesh(merge(rail), new THREE.MeshLambertMaterial({ color: 0x5a6070 })));
  // 산책로
  const [pc, pg] = cvs(256, 64); pg.fillStyle = "#3a3a42"; pg.fillRect(0, 0, 256, 64); const pr = rng(4); for (let i = 0; i < 900; i++) { pg.fillStyle = `rgba(255,255,255,${pr() * .05})`; pg.fillRect(pr() * 256, pr() * 64, 2, 2); }
  const path = new THREE.Mesh(new THREE.PlaneGeometry(120, 2.2), new THREE.MeshLambertMaterial({ map: tex(pc, [24, 1]) })); path.rotation.x = -Math.PI / 2; path.position.set(0, .01, -1.1); scene.add(path);

  ndc.set(px / innerWidth * 2 - 1, -(py / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(matMeshes)[0];
  if (hit) {
    const g = groups[hit.object.userData.g]; let best = -1, bd = 1e9;
    for (const k of g.seats) { if (seatTaken(k)) continue; const d = Math.hypot(seats[k].x - hit.point.x, seats[k].z - hit.point.z); if (d < bd) { bd = d; best = k; } }
    if (best < 0) { if (!(mc && g.seats.includes(mc.seat))) toast("이 돗자리는 가득 찼어요", 2000); return; }
    return ws.send(JSON.stringify({ t: "sit", seat: best }));
  }
  const p = new THREE.Vector3(); if (!ray.ray.intersectPlane(groundPlane, p)) return;
  if (p.x < LAWN.x0 || p.x > LAWN.x1 || p.z < LAWN.z0 + .2 || p.z > LAWN.z1) return;
  const n = toNorm(p.x, p.z); ws.send(JSON.stringify({ t: "go", x: n.x, y: n.y }));
}

// ---------- 별똥별: 여러 종류가 무작위로 ----------
// 긴 꼬리(흰색) · 불덩이(짧고 아주 밝음, 하늘이 번쩍) · 쌍둥이(나란히 둘) · 색깔(초록·하늘·분홍) · 느린 금빛 · 소나기(한 점에서 여러 개)
const MAXQ = 40, mPos = new Float32Array(MAXQ * 4 * 3), mCol = new Float32Array(MAXQ * 4 * 4), mIdx = [];
for (let i = 0; i < MAXQ; i++) { const o = i * 4; mIdx.push(o, o + 1, o + 2, o + 2, o + 1, o + 3); }
const mGeo = new THREE.BufferGeometry(); mGeo.setAttribute("position", new THREE.BufferAttribute(mPos, 3)); mGeo.setAttribute("col", new THREE.BufferAttribute(mCol, 4)); mGeo.setIndex(mIdx);
const mMat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
  vertexShader: "attribute vec4 col; varying vec4 vc; void main(){ vc = col; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }",
  fragmentShader: "varying vec4 vc; void main(){ gl_FragColor = vec4(vc.rgb * vc.a, vc.a); }" });
const mMesh = new THREE.Mesh(mGeo, mMat); mMesh.frustumCulled = false; scene.add(mMesh);
const heads = []; for (let i = 0; i < 16; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, fog: false })); s.visible = false; scene.add(s); heads.push(s); }
const meteors = []; let nextMeteor = 2, flash = 0;
const KINDS = [["long", 30], ["fireball", 10], ["twin", 14], ["color", 18], ["slow", 12], ["shower", 8]];
const dirAt = (az, el) => new THREE.Vector3(Math.cos(el) * Math.sin(az), Math.sin(el), -Math.cos(el) * Math.cos(az));
function spawnMeteor(kind, az0, el0) {
  let sum = 0; for (const k of KINDS) sum += k[1]; let roll = Math.random() * sum;
  if (!kind) for (const k of KINDS) { if ((roll -= k[1]) < 0) { kind = k[0]; break; } }
  const az = az0 ?? camYaw() + (Math.random() - .5) * 2.2, el = el0 ?? .35 + Math.random() * .7, ang = (Math.random() < .5 ? -1 : 1) * (.3 + Math.random() * .5);
  const base = { az, el, daz: Math.cos(ang), del: -Math.abs(Math.sin(ang)) - .2, k: 0 };
  const C = { long: [1, 1, .96], fireball: [1, .85, .6], slow: [1, .82, .45], twin: [.95, .97, 1], shower: [.9, .95, 1] };
  const add = o => meteors.push({ ...base, ...o });
  if (kind === "long") add({ speed: .55, life: 1.6, tail: .22, w: 2.2, col: C.long });
  else if (kind === "fireball") { add({ speed: .7, life: 1.1, tail: .1, w: 6, col: C.fireball, head: 3 }); flash = .35; }
  else if (kind === "twin") { add({ speed: .5, life: 1.5, tail: .16, w: 1.8, col: C.twin }); add({ speed: .5, life: 1.5, tail: .16, w: 1.8, col: C.twin, el: el - .025, az: az + .02 }); }
  else if (kind === "color") { const cc = [[.45, 1, .6], [.45, .85, 1], [1, .55, .85]][Math.random() * 3 | 0]; add({ speed: .55, life: 1.4, tail: .18, w: 2.6, col: cc, head: 1.4 }); }
  else if (kind === "slow") add({ speed: .16, life: 4.5, tail: .12, w: 2.4, col: C.slow, head: 1.2 });
  else for (let i = 0; i < 5; i++) { const a = Math.random() * TAU; meteors.push({ az, el, daz: Math.cos(a), del: Math.sin(a) * .7 - .2, k: -i * .12, speed: .35, life: .9, tail: .08, w: 1.4, col: C.shower }); }
}
const camYaw = () => { const d = new THREE.Vector3(); camera.getWorldDirection(d); return Math.atan2(d.x, -d.z); };
function drawMeteors(dt) {
  const camPos = camera.position, R = 1200; let q = 0, hi = 0;
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i]; m.k += dt / m.life; if (m.k >= 1) { meteors.splice(i, 1); continue; } if (m.k < 0) continue;
    const t = m.k * m.speed * m.life, a = Math.sin(m.k * Math.PI);
    const H = dirAt(m.az + m.daz * t, m.el + m.del * t).multiplyScalar(R).add(camPos), T = dirAt(m.az + m.daz * (t - m.tail), m.el + m.del * (t - m.tail)).multiplyScalar(R).add(camPos);
    const side = new THREE.Vector3().subVectors(H, T).cross(new THREE.Vector3().subVectors(H, camPos)).normalize().multiplyScalar(m.w * R / 900);
    if (q < MAXQ) {
      const o = q * 4; [H.clone().add(side), H.clone().sub(side), T.clone().add(side.clone().multiplyScalar(.2)), T.clone().sub(side.clone().multiplyScalar(.2))].forEach((v, j) => mPos.set([v.x, v.y, v.z], (o + j) * 3));
      for (let j = 0; j < 4; j++) mCol.set([...m.col, j < 2 ? a : 0], (o + j) * 4); q++;
    }
    if (hi < heads.length) { const s = heads[hi++]; s.visible = true; s.position.copy(H); const sz = (m.head || .8) * 28 * R / 900; s.scale.set(sz, sz, 1); s.material.color.setRGB(m.col[0], m.col[1], m.col[2]); s.material.opacity = a; }
  }
  for (; hi < heads.length; hi++) heads[hi].visible = false;
  mGeo.setDrawRange(0, q * 6); mGeo.attributes.position.needsUpdate = true; mGeo.attributes.col.needsUpdate = true;
  nextMeteor -= dt * (view.lieK > .5 ? 2 : 1); if (nextMeteor < 0) { nextMeteor = 2.5 + Math.random() * 4; spawnMeteor(); }
}

// ---------- 서버 ----------
const EMOJIS_DEFAULT = ["❤️", "👍", "😂", "🥺", "👋", "✨", "🌙"];
let myNick = "", myG = "", myDir = "river";
try { myNick = localStorage.getItem("hn-nick") || ""; myG = localStorage.getItem("hn-gender") || ""; myDir = localStorage.getItem("hn-dir") === "front" ? "front" : "river"; } catch {}
let retry = 0;
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws?ch=3d&from=3d" + (myNick ? "&nick=" + encodeURIComponent(myNick) : "") + (myG ? "&g=" + myG : ""));
  ws.onopen = () => { retry = 0; };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.t === "init") {
      for (const c of chars.values()) scene.remove(c.root); chars.clear(); me = m.you;
      $("roomName").textContent = "여의도 02 · 3D" + (m.room > 1 ? " (" + m.room + ")" : "");
      for (const u of m.users) addChar(u, u.id === me);
      $("cnt").textContent = m.users.length; buildEmo(m.emojis || EMOJIS_DEFAULT); buildBar();
      if (myDir === "front") ws.send(JSON.stringify({ t: "dir", d: "front" }));
      $("load").style.opacity = 0; setTimeout(() => $("load").remove(), 700);
      setTimeout(() => toast("빛나는 돗자리를 눌러 앉아 보세요", 3500), 1500);
    }
    else if (m.t === "join") addChar(m.user, true);
    else if (m.t === "leave") removeChar(m.id);
    else if (m.t === "seat") { goSeat(m.id, m.seat); if (m.id === me) { const c = chars.get(me); if (c) { c.act = "sit"; syncBar(); } } }
    else if (m.t === "go") goTo(m.id, m.x, m.y);
    else if (m.t === "taken") toast("앗, 방금 다른 분이 먼저 앉았어요", 2200);
    else if (m.t === "emo") { const c = chars.get(m.id); if (c && c.emo.length < 3) showEmo(c, m.e); }
    else if (m.t === "heart") { const c = chars.get(m.to), f = chars.get(m.from); if (c) showEmo(c, m.e || "💗"); if (f) setMood(f, "😂"); if (m.to === me) toast(`${m.e || "💗"} ${f ? f.nick : "누군가"}님이 마음을 보냈어요`, 2400); }
    else if (m.t === "cheers") { for (const id of [m.from, m.to]) { const c = chars.get(id); if (c) { c.cheerAt = performance.now(); showEmo(c, "🥂"); } } }
    else if (m.t === "act") { const c = chars.get(m.id); if (c) c.act = m.a; if (m.id === me) syncBar(); }
    else if (m.t === "dir") { const c = chars.get(m.id); if (c) c.dir = m.d; }
    else if (m.t === "nick") { const c = chars.get(m.id); if (c) { c.nick = m.n; c.root.remove(c.lbl); c.lbl = labelSprite(m.id === me ? "나 · " + m.n : m.n, m.id === me); c.root.add(c.lbl); } }
    else if (m.t === "count") $("cnt").textContent = m.room;
    else if (m.t === "star") spawnMeteor("long");
    else if (m.t === "meteor") for (let i = 0; i < 6; i++) setTimeout(() => spawnMeteor(), i * 700);
    else if (m.t === "full") { toast("지금 3D 채널이 꽉 찼어요", 0); retry = 99; }
    else if (m.t === "restart") toast("잠깐 새 단장 중이에요", 0);
  };
  ws.onclose = () => { if (retry >= 99) return; toast("다시 연결하고 있어요", 0); setTimeout(connect, Math.min(15000, 1000 * 2 ** retry++)); };
}
function buildEmo(list) {
  const box = $("emo"); if (box.childElementCount) return;
  for (const e of list) { const b = document.createElement("button"); b.textContent = e; b.onclick = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: "emo", e })); const c = chars.get(me); if (c) showEmo(c, e); box.classList.remove("open"); }; box.appendChild(b); }
}
function sendLie(on) {
  const c = chars.get(me); if (!c || c.state !== "sit" && !(c.state === "walk" && c.then === "sit")) return toast("먼저 빛나는 돗자리를 눌러 앉아 주세요", 2400);
  const a = on ? "lie" : "sit"; c.act = a; syncBar(); if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: "act", a }));
  if (on) toast("🛌 누워서 하늘을 봐요 · 화면을 누르면 일어나요", 3000);
}
function buildBar() {
  const bar = $("bar"); if (bar.childElementCount) return syncBar();
  const mk = (id, html, fn) => { const b = document.createElement("button"); b.id = id; b.innerHTML = html; b.onclick = fn; bar.appendChild(b); return b; };
  mk("bEmo", "😊<span>마음</span>", () => $("emo").classList.toggle("open"));
  mk("bLie", "", () => { const c = chars.get(me); sendLie(!(c && c.act === "lie")); });
  mk("bDir", "", () => {
    myDir = myDir === "front" ? "river" : "front"; try { localStorage.setItem("hn-dir", myDir); } catch {}
    const c = chars.get(me); if (c) c.dir = myDir; if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: "dir", d: myDir })); syncBar();
    toast(myDir === "front" ? "🙂 도시 쪽을 보고 앉았어요" : "🌊 한강을 보고 앉았어요", 1800);
  });
  mk("bView", "🧭<span>한강 쪽</span>", () => { view.yaw = 0; view.pitch = .36; view.R = 11.5; view.vy = 0; });
  mk("bCity", "🏙️<span>도시 쪽</span>", () => { view.yaw = Math.PI; view.pitch = .3; view.R = 11.5; view.vy = 0; });
  mk("bStar", "🌠<span>별똥별</span>", () => { if (performance.now() - (buildBar.st || 0) < 10000) return toast("별똥별은 10초에 하나씩 보낼 수 있어요", 1600); buildBar.st = performance.now(); if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: "star", x: .5, y: .15 })); });
  syncBar();
}
function syncBar() {
  const c = chars.get(me), lie = c && c.act === "lie";
  const l = $("bLie"); if (l) { l.innerHTML = lie ? "🧍<span>일어나기</span>" : "🛌<span>눕기</span>"; l.classList.toggle("sel", lie); }
  const d = $("bDir"); if (d) d.innerHTML = myDir === "front" ? "🙂<span>도시 보기</span>" : "🌊<span>한강 보기</span>";
}

// ---------- 매 프레임 ----------
const clock = new THREE.Clock(); let fpsN = 0, fpsT = 0, fps = 0;
const showPerf = /[?&]perf\b/.test(location.search); if (showPerf) $("perf").style.display = "block";
function frame() {
  const dt = Math.min(.1, clock.getDelta()), t = clock.elapsedTime;
  for (const c of [...chars.values()]) stepChar(c, dt, t);
  // 빈자리 점
  const free = []; for (let i = 0; i < seats.length; i++) if (!seatTaken(i)) free.push(new THREE.Vector3(seats[i].x, .06, seats[i].z));
  freeDots.geometry.setFromPoints(free); freeDots.material.opacity = .45 + .35 * Math.sin(t * 2.6);
  // 반짝이는 별·장애등·LED·차
  starSets[0].material.opacity = .65 + .3 * Math.sin(t * 1.3); starSets[1].material.opacity = .65 + .3 * Math.sin(t * 1.7 + 2);
  avi.material.opacity = (t % 1.6) < .8 ? 1 : .15;
  if (window.__led) window.__led.forEach((m, i) => m.color.setHSL(((t * .05 + i * .17) % 1), .8, .6));
  const cp = cars.mesh.geometry.attributes.position;
  cars.forEach((c, i) => { c.x += c.v * dt; if (c.x > 300) c.x = -300; if (c.x < -300) c.x = 300; cp.setXYZ(i, c.x, c.y, c.z); }); cp.needsUpdate = true;
  drawMeteors(dt);
  if (flash > 0) { flash -= dt; scene.fog.color.setRGB(.04 + flash * .5, .05 + flash * .5, .15 + flash * .4); } else scene.fog.color.setHex(0x0a0d26);
  placeCamera(dt);
  renderer.render(scene, camera);
  fpsN++; fpsT += dt; if (fpsT > 1) { fps = fpsN / fpsT; fpsN = 0; fpsT = 0; if (showPerf) $("perf").textContent = `${fps.toFixed(0)}fps · ${renderer.info.render.calls} calls · ${(renderer.info.render.triangles / 1000).toFixed(0)}k tris`; }
  requestAnimationFrame(frame);
}
window.__hn = { chars, seats, groups, view, renderer, spawnMeteor, send: m => ws && ws.readyState === 1 && ws.send(JSON.stringify(m)), get me() { return me; }, get fps() { return fps; } };
connect(); frame();
</script>
