<style>
  :root { --ink: #eef1f8; --dim: rgba(238,241,248,.62); --glass: rgba(14,20,40,.55); --line: rgba(255,255,255,.12); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #070b1c; color: var(--ink); overflow: hidden;
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
  .pill { background: var(--glass); border: 1px solid var(--line); border-radius: 999px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #top { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
  #top > * { pointer-events: auto; padding: 8px 14px; font-size: 14px; display: flex; align-items: center; gap: 10px; }
  #top button { all: unset; cursor: pointer; font-size: 16px; line-height: 1; }
  #acts { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom)); display: flex; gap: 2px; padding: 5px; max-width: calc(100vw - 24px); overflow-x: auto; scrollbar-width: none; opacity: 0; transition: opacity .6s; }
  #acts::-webkit-scrollbar { display: none; }
  #acts.more { -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent); }
  #acts.on { opacity: 1; }
  #acts button { all: unset; cursor: pointer; flex: 0 0 auto; min-width: 48px; height: 48px; padding: 0 4px; display: grid; place-items: center; align-content: center; gap: 1px; border-radius: 16px; font-size: 20px; line-height: 1; transition: background .15s, transform .15s; }
  #acts button span { font-size: 10.5px; color: var(--dim); }
  #acts button.sel { background: rgba(243,217,164,.2); }
  #acts button.sel span { color: var(--ink); }
  #acts button:active { transform: scale(.9); }
  #acts .sep { flex: 0 0 1px; background: var(--line); margin: 8px 2px; }
  #acts button.cool { opacity: .45; }
  #fwInfo { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 66px); padding: 7px 14px; font-size: 13px; white-space: nowrap; display: none; pointer-events: none; }
  #fwInfo.on { display: block; }
  #emo { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 66px); display: none; gap: 2px; padding: 6px; }
  #emo.open { display: flex; }
  #emo button { all: unset; cursor: pointer; font-size: 24px; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; transition: transform .15s, background .15s; }
  #emo button:active { transform: scale(.85); background: rgba(255,255,255,.12); }
  #emo button.cool { opacity: .35; }
  #mixer { position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 52px); right: 16px; width: min(300px, calc(100vw - 32px)); padding: 14px 16px; border-radius: 18px; display: none; font-size: 14px; }
  #mixer.on { display: block; }
  #mixer .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  #mixer .row > :first-child { flex: 0 0 86px; }
  #mixer input[type=range] { flex: 1; accent-color: #f3d9a4; min-width: 0; }
  #mixer input[type=range]:disabled { opacity: .3; }
  #mixer button { all: unset; cursor: pointer; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  #mixer button.on { background: rgba(243,217,164,.18); border-color: rgba(243,217,164,.5); color: var(--ink); }
  #mixer .head { display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
  #mixer small { display: block; color: var(--dim); font-size: 12px; margin-top: 6px; }
  #toast { position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 52px); left: 50%; transform: translateX(-50%); padding: 8px 16px; font-size: 13px; color: var(--ink); opacity: 0; transition: opacity .4s; white-space: nowrap; pointer-events: none; }
  #toast.on { opacity: 1; }
  #gate { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 60%, rgba(7,11,28,.3), rgba(7,11,28,.85)); transition: opacity .8s; }
  #gate.off { opacity: 0; pointer-events: none; }
  #gate .box { text-align: center; padding: 0 16px; }
  #gate h1 { margin: 0 0 10px; font-size: 28px; font-weight: 700; letter-spacing: -.5px; }
  #gate p { margin: 0 0 28px; color: var(--dim); font-size: 15px; line-height: 1.6; }
  #gate button { all: unset; cursor: pointer; padding: 14px 30px; border-radius: 999px; background: #f3d9a4; color: #1b1a22; font-weight: 700; font-size: 16px; }
  #gate small { display: block; margin-top: 18px; color: var(--dim); font-size: 12px; }
</style>

<body>
<canvas id="cv"></canvas>
<div id="top">
  <div class="pill">🌉 <span id="roomName">한강</span></div>
  <div class="pill"><span>👤 <b id="cnt">0</b></span><button id="snd" aria-label="소리">🔈</button></div>
</div>
<div id="toast" class="pill"></div>
<div id="mixer" class="pill">
  <div class="head"><span>소리</span><button id="mxPower" class="on">켜짐</button></div>
  <div class="row"><span>전체 크기</span><input type="range" id="mxMaster" min="0" max="100" aria-label="전체 크기"></div>
  <div id="mxTracks"></div>
  <small>강물만 켜 두는 걸 추천해요. 설정은 이 기기에 저장돼요.</small>
</div>
<div id="emo" class="pill"></div>
<div id="acts" class="pill"></div>
<div id="fwInfo" class="pill"></div>
<div id="gate"><div class="box">
  <h1>밤 한강 돗자리</h1>
  <p id="gateMsg">조용한 강변에 잠깐 앉았다 가요.<br>여기 앉은 사람들은 모두 지금 접속한 사람이에요.</p>
  <button id="go">돗자리 펴기</button>
  <small id="soundNote">말은 못 하고 이모지만 보낼 수 있어요.</small>
</div></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const cv = $("cv"), cx = cv.getContext("2d");
const SEATS = 30;                              // server.js CAP과 같아야 함 (세로 화면 5줄×6, 가로 화면 3줄×10)
const ROOM_NAMES = ["여의도", "반포", "뚝섬", "망원", "이촌", "잠원", "광나루", "난지"];
const MATS = [["#3d6fb6", "#e9eef5"], ["#c4473f", "#f1e9df"], ["#3f8a63", "#e8efe4"], ["#d9a33c", "#f4ecd9"]];
const HAIR = ["#2a211d", "#3b2a22", "#1d1c22", "#5a3d2b", "#2b2a33"];
const TAU = Math.PI * 2;

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- 화면 배치 (높이에 대한 비율) ----------
// 하늘 | 건너편 강변(S) | 다리 상판(D)~교각 밑(P) | 물 | 이쪽 둑(B) | 산책로 | 잔디·돗자리
const Y = { S: .36, D: .398, P: .432, B: .565, path0: .578, path1: .612 };
let W, H, U, DPR, bg, city, cityGlow, dynWin = [], leds = [], shoot = null, nextShoot = 12, vignette, plane = null, nextPlane = 20, clouds = [], stars = [], avi = [], cars = [], lamps = [], seats = [];
const moon = {};

function layout() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  U = Math.min(W, H * .8) / 420;
  seats = [];
  const r = rng(7);
  // 가로 화면은 줄 사이가 좁아 캐릭터가 겹치므로 3줄×10으로 넓게 편다
  const land = W > H * 1.1, ROWS = land ? 3 : 5, COLS = SEATS / ROWS;
  for (let row = 0; row < ROWS; row++) {
    const y = H * (land ? .668 + row * .105 : .652 + row * .058);
    const s = land ? Math.min((.7 + row * .2) * U, H * .105 / 40) : (.62 + row * .13) * U * 1.15;
    const spread = land ? Math.min(W - 70 * s, W * (.6 + row * .12)) : Math.min(W * (.66 + row * .07), (300 + row * 40) * U * 1.5);
    for (let c = 0; c < COLS; c++) {
      const x = W / 2 + (c - (COLS - 1) / 2) / (COLS - 1) * spread * .92 + (r() - .5) * 10 * s;
      seats.push({ x, y: y + (r() - .5) * 6 * s, s, mat: MATS[Math.floor(r() * MATS.length)], tilt: (r() - .5) * .12 });
    }
  }
  moon.x = W * .8; moon.y = H * .15; moon.r = 13 * U;
  drawCity(); drawBg(); makeClouds();
  for (const c of chars.values()) {
    if (c.state === "sit") { c.x = seats[c.seat].x; c.y = seats[c.seat].y; }
    else if (c.state === "stand") { const p = standSpot(c.id); c.x = p.x; c.y = p.y; }
  }
}
// 작게 줄였다가 다시 키우면 흐려진다 (canvas filter를 못 쓰는 사파리에서도 동작)
function blurred(src, k) {
  const a = document.createElement("canvas"); a.width = Math.max(1, src.width / k | 0); a.height = Math.max(1, src.height / k | 0);
  const g = a.getContext("2d"); g.imageSmoothingQuality = "high"; g.drawImage(src, 0, 0, a.width, a.height);
  return a;
}
function canvas(w, h) { const c = document.createElement("canvas"); c.width = Math.ceil(w * DPR); c.height = Math.ceil(h * DPR); const g = c.getContext("2d"); g.scale(DPR, DPR); return [c, g]; }

// 건너편 도시: 먼 줄 → 남산 → 중간 줄 → 가까운 줄, 투명 배경 (물에 비출 때도 씀)
function drawCity() {
  const base = H * Y.S;
  let g; [city, g] = canvas(W, base + 2);
  const r = rng(21);
  avi = []; dynWin = []; leds = [];
  const tall = [];
  const row = (col, hMin, hMax, wMin, wMax, win, winA, lowNearHill) => {
    let x = -10 - r() * 20;
    while (x < W + 10) {
      const w = (wMin + r() * (wMax - wMin)) * U;
      let h = (hMin + r() * r() * (hMax - hMin)) * U;
      if (lowNearHill && x > W * .1 && x < W * .34) h *= .45;
      g.fillStyle = col; g.fillRect(x, base - h, w, h + 2);
      if (h > 26 * U && r() < .3) { g.fillRect(x + w / 2 - .5 * U, base - h - 6 * U, 1 * U, 6 * U); if (r() < .7) avi.push({ x: x + w / 2, y: base - h - 6 * U, ph: r() * TAU }); }
      if (h > 40 * U && winA > .5) tall.push({ x, w, top: base - h });
      if (r() > .12) {
        const warm = r() < .7;
        for (let wy = base - h + 3 * U; wy < base - 2 * U; wy += 4.2 * U)
          for (let wx = x + 2.5 * U; wx < x + w - 2.5 * U; wx += 3.6 * U) {
            const c = warm ? `255,${200 + r() * 30 | 0},${130 + r() * 40 | 0}` : "200,225,255", a = winA * (.6 + r() * .4);
            if (winA > .5 && r() < .05 && dynWin.length < 160) { dynWin.push({ x: wx, y: wy, w: 1.5 * U, h: 1.9 * U, c, a, per: 18 + r() * 50, ph: r() * 100 }); continue; }
            if (r() < win) { g.fillStyle = `rgba(${c},${a})`; g.fillRect(wx, wy, 1.5 * U, 1.9 * U); }
          }
      }
      g.fillStyle = "rgba(255,255,255,.035)"; g.fillRect(x, base - h, 1, h);
      x += w + r() * 3 * U;
    }
  };
  // 도시 불빛이 하늘에 번지는 빛
  const glow = g.createLinearGradient(0, base - 110 * U, 0, base);
  glow.addColorStop(0, "rgba(255,150,120,0)"); glow.addColorStop(1, "rgba(255,150,120,.2)");
  g.fillStyle = glow; g.fillRect(0, base - 110 * U, W, 110 * U);
  row("#232b57", 10, 46, 9, 22, .1, .35, false);
  // 남산과 N타워
  const tx = W * .22, hillTop = base - 62 * U;
  g.fillStyle = "#1a2047"; g.beginPath(); g.moveTo(W * .0, base); g.bezierCurveTo(W * .12, hillTop + 10 * U, W * .18, hillTop, tx, hillTop); g.bezierCurveTo(W * .27, hillTop, W * .33, hillTop + 14 * U, W * .46, base); g.fill();
  g.fillStyle = "#1f2650";
  g.beginPath(); g.moveTo(tx - 3 * U, hillTop + 2 * U); g.lineTo(tx + 3 * U, hillTop + 2 * U); g.lineTo(tx + 1.6 * U, hillTop - 38 * U); g.lineTo(tx - 1.6 * U, hillTop - 38 * U); g.fill();
  g.beginPath(); g.ellipse(tx, hillTop - 41 * U, 7.5 * U, 4 * U, 0, 0, TAU); g.fill();
  g.fillRect(tx - .7 * U, hillTop - 66 * U, 1.4 * U, 25 * U);
  g.fillStyle = "rgba(255,200,150,.85)"; g.fillRect(tx - 6.5 * U, hillTop - 42 * U, 13 * U, 1.4 * U);
  g.fillStyle = "rgba(255,200,150,.45)"; g.fillRect(tx - 5.5 * U, hillTop - 39.5 * U, 11 * U, 1 * U);
  moon.tower = { x: tx, y: hillTop - 66 * U };
  row("#171e42", 14, 72, 12, 30, .2, .6, true);
  // 금빛 유리 빌딩
  const gx = W * .68, gw = 20 * U, gh = 108 * U;
  const gold = g.createLinearGradient(gx, 0, gx + gw, 0);
  gold.addColorStop(0, "#5c4520"); gold.addColorStop(.45, "#c9973f"); gold.addColorStop(.6, "#e6b85c"); gold.addColorStop(1, "#5c4520");
  g.fillStyle = gold; g.beginPath(); g.moveTo(gx, base); g.lineTo(gx, base - gh + 8 * U); g.lineTo(gx + gw, base - gh); g.lineTo(gx + gw, base); g.fill();
  g.fillStyle = "rgba(40,25,5,.35)"; for (let y = base - gh + 10 * U; y < base; y += 2.6 * U) g.fillRect(gx, y, gw, .6 * U);
  avi.push({ x: gx + gw - 2 * U, y: base - gh - 1 * U, ph: 1 });
  row("#10153a", 8, 38, 18, 40, .3, .85, true);
  // 색 조명 빌딩: 가장 높은 건물 몇 채의 모서리와 꼭대기에 천천히 색이 도는 LED
  tall.sort((a, b) => a.top - b.top).filter((b, i, arr) => !arr.slice(0, i).some(o => Math.abs(o.x - b.x) < 40 * U)).slice(0, 3).forEach((b, i) => leds.push({ ...b, hue: i * 110 }));
  // 강변북로 가로등 줄
  for (let x = 2 * U; x < W; x += 7 * U) { g.fillStyle = "rgba(255,190,120,.7)"; g.fillRect(x, base - 1.6 * U, 1.2 * U, 1.2 * U); }
  cityGlow = blurred(city, 10);
  cars = [];
  for (let i = 0; i < 14; i++) cars.push({ x: r() * W, dir: i % 2 ? 1 : -1, v: (12 + r() * 10) * U });
}

function drawBg() {
  let g; [bg, g] = canvas(W, H);
  const r = rng(11), base = H * Y.S;
  // 하늘
  let gr = g.createLinearGradient(0, 0, 0, base);
  gr.addColorStop(0, "#04061a"); gr.addColorStop(.45, "#121747"); gr.addColorStop(.78, "#2c2560"); gr.addColorStop(1, "#5a3a72");
  g.fillStyle = gr; g.fillRect(0, 0, W, base + 1);
  for (let i = 0; i < 170; i++) { const y = r() * base * .8; g.fillStyle = `rgba(255,255,255,${(.1 + r() * .35) * (1 - y / base)})`; g.fillRect(r() * W, y, .9, .9); }
  stars = [];
  for (let i = 0; i < 40; i++) stars.push({ x: r() * W, y: r() * base * .6, ph: r() * TAU, sp: .5 + r() * 1.5, s: r() < .25 ? 1.8 : 1.2 });
  // 달
  gr = g.createRadialGradient(moon.x, moon.y, moon.r, moon.x, moon.y, moon.r * 6);
  gr.addColorStop(0, "rgba(255,240,210,.22)"); gr.addColorStop(1, "rgba(255,240,210,0)");
  g.fillStyle = gr; g.fillRect(moon.x - moon.r * 6, moon.y - moon.r * 6, moon.r * 12, moon.r * 12);
  gr = g.createRadialGradient(moon.x - moon.r * .3, moon.y - moon.r * .3, 0, moon.x, moon.y, moon.r);
  gr.addColorStop(0, "#fffaf0"); gr.addColorStop(1, "#eadfc2");
  g.fillStyle = gr; g.beginPath(); g.arc(moon.x, moon.y, moon.r, 0, TAU); g.fill();
  g.fillStyle = "rgba(190,175,140,.28)";
  [[-.35, -.2, .22], [.25, .2, .3], [.1, -.45, .14], [-.15, .4, .12]].forEach(([a, b, c]) => { g.beginPath(); g.arc(moon.x + a * moon.r, moon.y + b * moon.r, c * moon.r, 0, TAU); g.fill(); });
  // 강
  gr = g.createLinearGradient(0, base, 0, H * Y.B);
  gr.addColorStop(0, "#151c3e"); gr.addColorStop(1, "#080e26");
  g.fillStyle = gr; g.fillRect(0, base, W, H * (Y.B - Y.S));
  // 이쪽 둑: 돌 둑, 산책로, 잔디
  g.fillStyle = "#2b303c"; g.fillRect(0, H * Y.B, W, H * (Y.path0 - Y.B));
  g.fillStyle = "rgba(255,255,255,.08)"; g.fillRect(0, H * Y.B, W, 1);
  gr = g.createLinearGradient(0, H * Y.path0, 0, H);
  gr.addColorStop(0, "#152620"); gr.addColorStop(1, "#0a140f");
  g.fillStyle = gr; g.fillRect(0, H * Y.path0, W, H * (1 - Y.path0));
  g.fillStyle = "#24272d"; g.fillRect(0, H * Y.path0, W, H * (Y.path1 - Y.path0));
  g.fillStyle = "rgba(255,255,255,.05)"; g.fillRect(0, H * (Y.path0 + Y.path1) / 2, W, 1);
  { const [v, vg] = canvas(W, H); const gr2 = vg.createRadialGradient(W / 2, H * .55, Math.min(W, H) * .35, W / 2, H * .55, Math.hypot(W, H) * .62);
    gr2.addColorStop(0, "rgba(3,5,14,0)"); gr2.addColorStop(1, "rgba(3,5,14,.55)"); vg.fillStyle = gr2; vg.fillRect(0, 0, W, H); vignette = v; }
  lamps = [];
  for (let lx = W * .12; lx < W; lx += Math.max(120 * U, W / 3.2)) {
    lamps.push(lx);
    gr = g.createRadialGradient(lx, H * Y.path1, 0, lx, H * Y.path1, 120 * U);
    gr.addColorStop(0, "rgba(255,200,130,.2)"); gr.addColorStop(1, "rgba(255,200,130,0)");
    g.fillStyle = gr; g.beginPath(); g.ellipse(lx, H * Y.path1, 140 * U, 52 * U, 0, 0, TAU); g.fill();
    g.fillStyle = "#2c2f37"; g.fillRect(lx - 1.2 * U, H * Y.path0 - 46 * U, 2.4 * U, 46 * U);
    g.fillRect(lx - 1.2 * U, H * Y.path0 - 47 * U, 6 * U, 1.6 * U);
    g.fillStyle = "#ffe2b0"; g.beginPath(); g.arc(lx + 5 * U, H * Y.path0 - 45 * U, 2.6 * U, 0, TAU); g.fill();
    gr = g.createRadialGradient(lx + 5 * U, H * Y.path0 - 45 * U, 0, lx + 5 * U, H * Y.path0 - 45 * U, 28 * U);
    gr.addColorStop(0, "rgba(255,220,160,.32)"); gr.addColorStop(1, "rgba(255,220,160,0)");
    g.fillStyle = gr; g.fillRect(lx - 25 * U, H * Y.path0 - 75 * U, 60 * U, 60 * U);
  }
  g.strokeStyle = "rgba(90,130,100,.22)"; g.lineWidth = 1;
  for (let i = 0; i < 180; i++) { const gx = r() * W, gy = H * (Y.path1 + .01) + r() * H * .4, gh = (3 + r() * 5) * U; g.beginPath(); g.moveTo(gx, gy); g.lineTo(gx + (r() - .5) * 3, gy - gh); g.stroke(); }
}

function makeClouds() {
  const r = rng(5);
  clouds = [];
  for (let k = 0; k < 4; k++) {
    const cw = (160 + r() * 140) * U, ch = 34 * U, [c, g] = canvas(cw, ch);
    for (let i = 0; i < 12; i++) {
      const x = cw * (.15 + r() * .7), y = ch * (.4 + r() * .2), rr = (12 + r() * 14) * U;
      const gr = g.createRadialGradient(x, y, 0, x, y, rr);
      gr.addColorStop(0, "rgba(150,160,205,.06)"); gr.addColorStop(1, "rgba(150,160,205,0)");
      g.fillStyle = gr; g.save(); g.translate(x, y); g.scale(2.6, 1); g.beginPath(); g.arc(0, 0, rr, 0, TAU); g.restore(); g.fill();
    }
    clouds.push({ c, w: cw, h: ch, x: r() * W, y: H * (.05 + r() * .2), v: (1.5 + r() * 2.5) * U });
  }
}

// ---------- 움직이는 풍경 ----------
let train = null, nextTrain = 6, boat = null, nextBoat = 3;
function hsl2rgb(h) { const f = n => { const k = (n + h / 30) % 12; return Math.round(255 * (.65 - .28 * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); }; return `${f(0)},${f(8)},${f(4)}`; }
function streak(x, y, w, a, col) { cx.fillStyle = `rgba(${col},${a})`; cx.fillRect(x - w / 2, y, w, 1.3 * U); }

function drawScene(t, dt) {
  const base = H * Y.S, dY = H * Y.D, pY = H * Y.P, bY = H * Y.B;
  cx.drawImage(bg, 0, 0, W, H);
  // 반짝이는 별, 구름
  for (const s of stars) { cx.fillStyle = `rgba(255,255,255,${.25 + .6 * Math.abs(Math.sin(t * s.sp + s.ph))})`; cx.fillRect(s.x, s.y, s.s, s.s); }
  nextPlane -= dt;
  if (!plane && nextPlane <= 0) plane = { x: -10, y: H * (.06 + Math.random() * .12), v: (8 + Math.random() * 5) * U };
  if (plane) {
    plane.x += plane.v * dt;
    cx.fillStyle = "rgba(255,255,255,.8)"; cx.fillRect(plane.x, plane.y, 1.4, 1.4);
    if (Math.sin(t * 5) > .6) { cx.fillStyle = "rgba(255,80,80,.95)"; cx.fillRect(plane.x - 3 * U, plane.y + .5, 1.6, 1.6); }
    if (plane.x > W + 10) { plane = null; nextPlane = 50 + Math.random() * 60; }
  }
  nextShoot -= dt;
  if (!shoot && nextShoot <= 0) shoot = { x: W * (.15 + Math.random() * .6), y: H * (.03 + Math.random() * .12), k: 0, dx: (Math.random() < .5 ? -1 : 1) * 1.6, len: (40 + Math.random() * 40) * U };
  if (shoot) {
    shoot.k += dt / .9;
    const k = shoot.k, hx = shoot.x + shoot.dx * k * shoot.len, hy = shoot.y + k * shoot.len * .55;
    const gs = cx.createLinearGradient(hx, hy, hx - shoot.dx * 30 * U, hy - 16 * U);
    gs.addColorStop(0, `rgba(255,255,255,${.9 * (1 - k)})`); gs.addColorStop(1, "rgba(255,255,255,0)");
    cx.strokeStyle = gs; cx.lineWidth = 1.2; cx.beginPath(); cx.moveTo(hx, hy); cx.lineTo(hx - shoot.dx * 30 * U, hy - 16 * U); cx.stroke();
    if (k >= 1) { shoot = null; nextShoot = 25 + Math.random() * 35; }
  }
  for (const c of clouds) { c.x += c.v * dt; if (c.x > W + 20) c.x = -c.w - 20; cx.drawImage(c.c, c.x, c.y, c.w, c.h); }
  // 도시 + 물에 비친 도시 (가로줄마다 물결에 따라 좌우로 일렁임)
  cx.drawImage(city, 0, 0, W, base + 2);
  for (const d of dynWin) {
    const v = Math.sin((t + d.ph) * TAU / d.per), a = Math.max(0, Math.min(1, v * 3 + .5));
    if (a > .01) { cx.fillStyle = `rgba(${d.c},${d.a * a})`; cx.fillRect(d.x, d.y, d.w, d.h); }
  }
  cx.globalCompositeOperation = "lighter";
  for (const b of leds) {
    const hue = (b.hue + t * 12) % 360;
    cx.fillStyle = `hsla(${hue},80%,65%,.75)`; cx.fillRect(b.x, b.top, 1 * U, base - b.top); cx.fillRect(b.x + b.w - 1 * U, b.top, 1 * U, base - b.top);
    cx.fillRect(b.x, b.top, b.w, 1.2 * U);
    const lg = cx.createLinearGradient(0, b.top - 14 * U, 0, b.top + 4 * U); lg.addColorStop(0, `hsla(${hue},80%,65%,0)`); lg.addColorStop(1, `hsla(${hue},80%,65%,.22)`);
    cx.fillStyle = lg; cx.fillRect(b.x - 6 * U, b.top - 14 * U, b.w + 12 * U, 18 * U);
    for (let k = 0; k < 7; k++) streak(b.x + b.w / 2 + Math.sin(t * .9 + k * 1.7) * 1.5 * U, base + 3 * U + k * 4.5 * U, (b.w * .7 - k * 1.5 * U) * (.6 + .4 * Math.abs(Math.sin(t * 1.3 + k))), .16 - k * .02, `${hsl2rgb(hue)}`);
  }
  cx.globalAlpha = .45;
  cx.drawImage(cityGlow, 0, 0, W, base + 2);
  cx.save(); cx.translate(0, base); cx.scale(1, -1.15); cx.globalAlpha = .22; cx.drawImage(cityGlow, 0, -base, W, base + 2); cx.restore();
  cx.globalCompositeOperation = "source-over";
  cx.globalAlpha = .5;
  for (let y = base; y < bY; y += 2) {
    const d = y - base, sy = base - d * 1.15 - 2;
    if (sy < 0) break;
    const off = Math.sin(t * .8 + y * .45) * (.4 + d * .05) * U + Math.sin(t * .45 + y * .13) * d * .02 * U;
    cx.drawImage(city, 0, sy * DPR, W * DPR, 2 * DPR, off, y, W, 2);
  }
  cx.globalAlpha = 1;
  let gr = cx.createLinearGradient(0, base, 0, bY);
  gr.addColorStop(0, "rgba(14,20,48,.1)"); gr.addColorStop(1, "rgba(8,12,34,.75)");
  cx.fillStyle = gr; cx.fillRect(0, base, W, bY - base);
  // 강변 차 불빛, 항공 경고등, 타워 꼭대기
  for (const c of cars) {
    c.x += c.dir * c.v * dt; if (c.x > W + 5) c.x = -5; if (c.x < -5) c.x = W + 5;
    cx.fillStyle = c.dir > 0 ? "rgba(255,250,230,.9)" : "rgba(255,80,70,.85)"; cx.fillRect(c.x, base - (c.dir > 0 ? 2.6 : 3.4) * U, 1.3 * U, .9 * U);
  }
  for (const a of avi) if (Math.sin(t * 2 + a.ph) > .55) { cx.fillStyle = "rgba(255,70,60,.9)"; cx.beginPath(); cx.arc(a.x, a.y, 1.1 * U, 0, TAU); cx.fill(); }
  if (moon.tower) { const a = .5 + .5 * Math.sin(t * 1.5); cx.fillStyle = `rgba(255,120,110,${a})`; cx.beginPath(); cx.arc(moon.tower.x, moon.tower.y, 1.2 * U, 0, TAU); cx.fill(); }
  // 달빛 길
  for (let k = 0; k < 12; k++) {
    const y = base + 4 * U + k * (bY - base - 8 * U) / 12;
    const w = (3 + k * 1.6) * U * (.5 + .5 * Math.abs(Math.sin(t * 1.4 + k * 1.9)));
    streak(moon.x + Math.sin(t * .9 + k * 2.3) * (1 + k * .4) * U, y, w, .16 + .1 * Math.sin(t * 2 + k), "255,240,210");
  }
  // 강 위 옅은 안개
  gr = cx.createLinearGradient(0, base - 16 * U, 0, base + 22 * U);
  const fa = .09 + .03 * Math.sin(t * .2);
  gr.addColorStop(0, "rgba(160,170,210,0)"); gr.addColorStop(.5, `rgba(160,170,210,${fa})`); gr.addColorStop(1, "rgba(160,170,210,0)");
  cx.fillStyle = gr; cx.fillRect(0, base - 16 * U, W, 38 * U);
  drawBridge(t, dt, dY, pY, bY);
  drawBoat(t, dt);
  // 가로등 불빛이 둑 가까운 물에 비침
  for (const lx of lamps) for (let k = 0; k < 6; k++) {
    const y = bY - 3 * U - k * 4 * U;
    streak(lx + 5 * U + Math.sin(t * 1.6 + k * 1.3 + lx) * 1.5 * U, y, (6 - k * .7) * U * (.6 + .4 * Math.abs(Math.sin(t * 2.2 + k))), .22 - k * .03, "255,210,150");
  }
  // 물결 줄
  cx.strokeStyle = "rgba(170,190,255,.05)"; cx.lineWidth = 1;
  for (let k = 0; k < 7; k++) {
    const yy = pY + (k + 1) * (bY - pY) / 8; cx.beginPath();
    for (let x = 0; x <= W; x += 16) cx.lineTo(x, yy + Math.sin(x * .03 + t * (.6 + k * .1) + k) * 1.2);
    cx.stroke();
  }
}

// 다리와 달빛무지개분수: 상판 옆에서 물줄기가 무지개색으로 쏟아지고 물에 비친다 (50초 켜짐, 20초 쉼)
function drawBridge(t, dt, dY, pY, bY) {
  const span = Math.min(80 * U, Math.max(56 * U, W / 6)), x0 = (W % span) / 2 - span, hit = pY + 3 * U;
  const cyc = t % 70, fade = cyc < 50 ? Math.min(1, cyc / 3, (50 - cyc) / 3) : 0;
  // 교각
  cx.fillStyle = "#090d22";
  for (let x = x0; x < W + span; x += span) { cx.fillRect(x - 3.5 * U, dY, 7 * U, hit - dY); cx.fillRect(x - 5 * U, dY + 2 * U, 10 * U, 2 * U); }
  // 분수
  if (fade > 0) {
    const n = Math.ceil(W / (5.5 * U));
    cx.globalCompositeOperation = "lighter"; cx.lineCap = "round";
    for (let pass = 0; pass < 2; pass++) {                          // 0: 물줄기, 1: 물에 비친 물줄기
      for (let i = 0; i <= n; i++) {
        const x = i * 5.5 * U, hue = (t * 25 + i * 6) % 360, sway = Math.sin(t * 1.7 + i * .45);
        const len = (hit - dY - 3 * U) * (.92 + .08 * sway), out = (5 + 2 * sway) * U;
        const sy = dY + 3 * U, ey = sy + len;
        cx.strokeStyle = `hsla(${hue},95%,${pass ? 60 : 70}%,${(pass ? .12 : .36) * fade})`;
        cx.lineWidth = (pass ? 1.6 : 1.2) * U;
        cx.beginPath();
        if (!pass) { cx.moveTo(x, sy); cx.quadraticCurveTo(x + out, sy + len * .15, x + out * .8, ey); }
        else { const w = Math.sin(t * 1.4 + i) * 1.5 * U; cx.moveTo(x + out * .8 + w, hit + (hit - ey) * -1 * .2); cx.quadraticCurveTo(x + out + w, hit + len * .75, x + w * .5, hit + len * 1.1); }
        cx.stroke();
      }
    }
    // 물이 떨어지는 곳의 물보라와 색 번짐
    for (let k = 0; k < 8; k++) {
      const x = k * W / 8, hue = (t * 25 + (x / (5.5 * U)) * 6) % 360;
      const g = cx.createLinearGradient(0, hit - 10 * U, 0, hit + 26 * U);
      g.addColorStop(0, `hsla(${hue},90%,65%,0)`); g.addColorStop(.3, `hsla(${hue},90%,65%,${.2 * fade})`); g.addColorStop(1, `hsla(${hue},90%,65%,0)`);
      cx.fillStyle = g; cx.fillRect(x, hit - 10 * U, W / 8 + 1, 36 * U);
    }
    for (let k = 0; k < 40; k++) {
      const x = ((k * 97.13 + t * 13) % W), y = hit - Math.abs(Math.sin(t * 3 + k)) * 5 * U;
      cx.fillStyle = `rgba(255,255,255,${.5 * fade})`; cx.fillRect(x, y, 1, 1);
    }
    cx.globalCompositeOperation = "source-over";
  }
  // 상판, 상판 아래 조명, 가로등
  cx.fillStyle = "#0b1028"; cx.fillRect(0, dY - 4 * U, W, 7 * U);
  cx.fillStyle = "rgba(255,255,255,.06)"; cx.fillRect(0, dY - 4 * U, W, 1);
  const n2 = Math.floor(W / (10 * U));
  for (let i = 0; i <= n2; i++) {
    const hue = 205 + 55 * Math.sin(t * .15 + i * .06);
    cx.fillStyle = `hsla(${hue},60%,74%,${.6 + .3 * Math.sin(t * 1.1 + i * .4)})`; cx.fillRect(i * 10 * U - .9 * U, dY + 1.4 * U, 1.8 * U, 1.2 * U);
  }
  for (let x = 20 * U; x < W; x += 40 * U) {
    cx.fillStyle = "#151a35"; cx.fillRect(x, dY - 11 * U, .8 * U, 7 * U);
    cx.fillStyle = "rgba(255,225,170,.95)"; cx.fillRect(x - .6 * U, dY - 12 * U, 2 * U, 1.4 * U);
    if (fade < .5) for (let k = 0; k < 4; k++) streak(x + Math.sin(t * 1.2 + k + x) * U, hit + 3 * U + k * 4 * U, (4 - k * .6) * U, .16 - k * .035, "255,220,160");
  }
  // 지하철
  nextTrain -= dt;
  if (!train && nextTrain <= 0) train = { dir: Math.random() < .5 ? -1 : 1, p: 0 };
  if (train) {
    const len = 140 * U, dir = train.dir;
    train.p += dt * 80 * U;
    const head = dir > 0 ? -len + train.p : W + len - train.p, tail = head - dir * len;
    cx.fillStyle = "#1e2548"; cx.fillRect(Math.min(head, tail), dY - 10 * U, len, 6 * U);
    cx.fillStyle = "rgba(225,240,255,.9)";
    for (let k = 0; k < 6; k++) for (let w = 0; w < 4; w++) cx.fillRect(head - dir * (k * len / 6 + 3 * U + w * 5.5 * U) - 1.5 * U, dY - 8.6 * U, 3 * U, 2.4 * U);
    if (train.p > W + len * 2) { train = null; nextTrain = 25 + Math.random() * 30; }
  }
}

// 유람선: 3층 선실 불빛, 줄전구, 파란 선체 조명, 물에 길게 늘어지는 반사. 아주 천천히 지나간다
function drawBoat(t, dt) {
  nextBoat -= dt;
  if (!boat && nextBoat <= 0) boat = { dir: Math.random() < .5 ? 1 : -1, p: 0 };
  if (!boat) return;
  boat.p += dt * 9 * U;
  const d = boat.dir, L = 150 * U, by = H * .54, bx = d > 0 ? -L * .6 + boat.p : W + L * .6 - boat.p;
  const left = bx - L / 2, right = bx + L / 2, bow = d > 0 ? right : left, stern = d > 0 ? left : right;
  // 물에 비친 모습 (선실 불빛이 세로로 길게 일렁임)
  cx.globalCompositeOperation = "lighter";
  for (let k = 0; k < 10; k++) {
    const y = by + 2 * U + k * 3.2 * U, a = .2 * (1 - k / 10);
    for (let j = 0; j < 9; j++) {
      const x = left + L * (.12 + j * .095) + Math.sin(t * 1.1 + k * .9 + j) * (1 + k * .3) * U;
      streak(x, y, (6 - k * .35) * U, a, j % 3 ? "255,210,140" : "255,190,120");
    }
    streak(bx + Math.sin(t + k) * 2 * U, y + 1.5 * U, L * (.8 - k * .05), a * .25, "120,170,255");
  }
  const gl = cx.createRadialGradient(bx, by - 14 * U, 0, bx, by - 14 * U, L * .55);
  gl.addColorStop(0, "rgba(255,200,130,.16)"); gl.addColorStop(1, "rgba(255,200,130,0)");
  cx.fillStyle = gl; cx.fillRect(bx - L * .55, by - 40 * U, L * 1.1, 46 * U);
  cx.globalCompositeOperation = "source-over";
  // 뱃머리 물결
  cx.lineWidth = 1;
  for (let k = 1; k < 5; k++) { cx.strokeStyle = `rgba(210,225,255,${.14 - k * .025})`; cx.beginPath(); cx.moveTo(stern, by - .5 * U); cx.lineTo(stern - d * k * 7 * U, by + k * 1.4 * U); cx.stroke(); }
  // 선체
  cx.fillStyle = "#f1eee8";
  cx.beginPath(); cx.moveTo(stern, by - 10 * U); cx.lineTo(bow + d * 6 * U, by - 10 * U); cx.lineTo(bow - d * 2 * U, by); cx.lineTo(stern + d * 2 * U, by); cx.closePath(); cx.fill();
  cx.fillStyle = "#1d2a5c"; cx.fillRect(Math.min(stern, bow), by - 4 * U, L, 2.4 * U);
  cx.fillStyle = "rgba(110,170,255,.9)"; cx.fillRect(Math.min(stern, bow), by - 1.8 * U, L, .9 * U);
  // 1층·2층·3층 선실
  const decks = [[.92, 9, 13], [.72, 8, 21], [.45, 6, 27]];
  for (const [wr, h, top] of decks) {
    const w = L * wr, x = bx - w / 2 - d * (1 - wr) * L * .12;
    cx.fillStyle = "#e7e3db"; cx.fillRect(x, by - top * U, w, h * U);
    cx.fillStyle = "rgba(0,0,0,.08)"; cx.fillRect(x, by - top * U + (h - 1) * U, w, 1 * U);
    const cnt = Math.floor(w / (4.6 * U));
    for (let k = 0; k < cnt; k++) {
      const flick = .85 + .15 * Math.sin(t * .7 + k * 2.1 + top);
      cx.fillStyle = `rgba(255,${205 + (k % 3) * 12},${130 + (k % 4) * 10},${flick})`;
      cx.fillRect(x + 1.5 * U + k * 4.6 * U, by - top * U + 1.8 * U, 3.2 * U, (h - 3.6) * U);
    }
  }
  // 맨 위 난간, 조타실
  cx.fillStyle = "#d6d1c7"; cx.fillRect(bx - L * .2, by - 30 * U, L * .4, 1 * U);
  for (let x = bx - L * .2; x <= bx + L * .2; x += 3 * U) cx.fillRect(x, by - 30 * U, .5 * U, 3 * U);
  cx.fillStyle = "#e7e3db"; cx.fillRect(bx + d * L * .05 - 6 * U, by - 35 * U, 12 * U, 6 * U);
  cx.fillStyle = "rgba(140,200,255,.9)"; cx.fillRect(bx + d * L * .05 - 5 * U, by - 34 * U, 10 * U, 2.4 * U);
  // 돛대와 줄전구 (뱃머리·고물까지)
  const mx = bx + d * L * .05, my = by - 48 * U;
  cx.fillStyle = "#cfcac0"; cx.fillRect(mx - .5 * U, my, 1 * U, 13 * U);
  cx.fillStyle = "rgba(255,90,80,.95)"; if (Math.sin(t * 3) > 0) cx.fillRect(mx - 1 * U, my - 1.6 * U, 2 * U, 2 * U);
  const bulbs = ["255,110,120", "255,215,110", "120,210,255", "160,255,170", "230,150,255"];
  cx.globalCompositeOperation = "lighter";
  for (const end of [bow + d * 5 * U, stern]) for (let k = 1; k < 16; k++) {
    const q = k / 16, x = mx + (end - mx) * q, y = my + (by - 10 * U - my) * q + Math.sin(q * Math.PI) * 4 * U;
    const a = .55 + .45 * Math.sin(t * 2.4 + k * .9);
    cx.fillStyle = `rgba(${bulbs[k % 5]},${a})`; cx.beginPath(); cx.arc(x, y, .9 * U, 0, TAU); cx.fill();
  }
  cx.globalCompositeOperation = "source-over";
  if (boat.p > W + L * 1.3) { boat = null; nextBoat = 35 + Math.random() * 30; }
}

// 돗자리. 비어 있으면 은은하게 빛나며 눌러 달라고 한다
function drawMat(s, glow) {
  const w = 46 * s.s, h = 16 * s.s;
  cx.fillStyle = "rgba(0,0,0,.22)"; cx.beginPath(); cx.ellipse(s.x, s.y + 4 * s.s, w * .55, h * .7, s.tilt, 0, TAU); cx.fill();
  cx.save(); cx.translate(s.x, s.y + 2 * s.s); cx.rotate(s.tilt);
  cx.beginPath(); cx.moveTo(-w * .42, -h / 2); cx.lineTo(w * .42, -h / 2); cx.lineTo(w / 2, h / 2); cx.lineTo(-w / 2, h / 2); cx.closePath();
  if (glow) { cx.shadowColor = `rgba(255,226,160,${glow})`; cx.shadowBlur = 14 * s.s; cx.strokeStyle = `rgba(255,232,180,${glow})`; cx.lineWidth = 1.6 * s.s; cx.stroke(); cx.shadowBlur = 0; }
  cx.fillStyle = s.mat[1]; cx.globalAlpha = .55; cx.fill(); cx.clip();
  cx.fillStyle = s.mat[0];
  for (let i = -6; i < 6; i += 2) cx.fillRect(i * w / 12, -h, w / 12, h * 2);
  cx.globalAlpha = .3; cx.fillRect(-w, -h / 2, w * 2, h / 4); cx.fillRect(-w, 0, w * 2, h / 4);
  // 가장자리 박음질, 접힌 자국, 앞쪽 그늘
  cx.globalAlpha = 1; cx.strokeStyle = "rgba(255,255,255,.28)"; cx.lineWidth = Math.max(.6, .7 * s.s);
  cx.beginPath(); cx.moveTo(-w * .4, -h / 2 + 1.2 * s.s); cx.lineTo(w * .4, -h / 2 + 1.2 * s.s); cx.lineTo(w * .48, h / 2 - 1.2 * s.s); cx.lineTo(-w * .48, h / 2 - 1.2 * s.s); cx.closePath(); cx.stroke();
  cx.strokeStyle = "rgba(0,0,0,.12)"; cx.beginPath(); cx.moveTo(0, -h / 2); cx.lineTo(0, h / 2); cx.stroke();
  const sh = cx.createLinearGradient(0, -h / 2, 0, h / 2); sh.addColorStop(0, "rgba(0,0,0,.25)"); sh.addColorStop(1, "rgba(0,0,0,0)");
  cx.fillStyle = sh; cx.fillRect(-w, -h / 2, w * 2, h);
  cx.restore(); cx.globalAlpha = 1;
}

// ---------- 캐릭터 ----------
// state: walk(걷는 중, 도착하면 then 상태로) | stand(산책로에 서 있음) | sit | leave
const chars = new Map();
let me = null, hinted = false;

  const r = rng(m.s), o = fwFrom(c), ty = Math.max(fwApex(m.p), fwR(m.p) * 1.05 + 58);   // 가로 화면에서 위로 잘리지 않게
  const tx = o.x + (W / 2 - o.x) * .3 + (r() - .5) * W * .25;
  rockets.push({ ...m, r, x0: o.x, y0: o.y, tx, ty, age: 0, dur: 1 + .5 * m.p, mine: m.id === me, trail: [] });
}
function burst(k) {
  const r = k.r, shape = FW_SHAPES[k.k], R = fwR(k.p), drag = 2.2;
  let n = Math.round((36 + 44 * k.p) * (shape === "double" ? 1.3 : 1));
  n = Math.min(n, FW_MAX - fwParts); if (n < 8) return;
  const ps = [], col = FW_HUES[k.h], col2 = FW_HUES[k.h2 === k.h ? (k.h + 3) % FW_HUES.length : k.h2];
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU + r() * .08;
    let sp = R * drag, vx, vy, c = col;
    if (shape === "peony") { sp *= .82 + r() * .18; vx = Math.cos(a) * sp; vy = Math.sin(a) * sp; }
    else if (shape === "ring") { vx = Math.cos(a) * sp; vy = Math.sin(a) * sp * .45; }
    else if (shape === "willow") { sp *= .55 + r() * .25; vx = Math.cos(a) * sp; vy = Math.sin(a) * sp; c = "255,200,110"; }
    else if (shape === "double") { const inner = i % 3 === 0; sp *= inner ? .45 : .88 + r() * .12; vx = Math.cos(a) * sp; vy = Math.sin(a) * sp; if (inner) c = col2; }
    else { const hx = 16 * Math.sin(a) ** 3, hy = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)); vx = hx / 17 * sp; vy = hy / 17 * sp; }
    ps.push({ x: k.tx, y: k.ty, vx, vy, c, tw: r() });
  }
  fwParts += n;
  bursts.push({ ps, n, age: 0, life: shape === "willow" ? 3.2 : 1.9, grav: (shape === "willow" ? 26 : 14) * U, drag: shape === "willow" ? 2.8 : drag, x: k.tx, y: k.ty, R, col });
  fwFlash = Math.min(1, fwFlash + .5 + .4 * k.p);
  thump(k.p, k.mine);
}
// 멀리서 '퍽': 잡음을 아주 짧게 낮은 음으로 걸러서. 기존 소리 패널(전체 크기·켜짐)을 그대로 따른다
let noiseBuf = null;
function thump(p, mine) {
  if (!actx || !SND.power || !started) return;
  const now = performance.now(); if (now - lastThump < 160) return; lastThump = now;
  if (!noiseBuf) { noiseBuf = actx.createBuffer(1, actx.sampleRate * .5 | 0, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (actx.sampleRate * .06)); }
  const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain(), t0 = actx.currentTime + .25;   // 멀어서 소리가 조금 늦게 온다
  src.buffer = noiseBuf; f.type = "lowpass"; f.frequency.value = 180 + 120 * p;
  g.gain.setValueAtTime((mine ? .5 : .3) * (.6 + .4 * p), t0);
  src.connect(f); f.connect(g); g.connect(masterGain); src.start(t0);
}
function drawFireworks(t, dt) {
  const base = H * Y.S, dY = H * Y.D, pY = H * Y.P, bY = H * Y.B;
  const water = (y, a) => { const ry = 2 * base - y; return ry > base && ry < bY && !(ry > dY && ry < pY) ? ry : null; };   // 물에 비친 자리(다리 뒤는 빼고)
  cx.globalCompositeOperation = "lighter";
  if (fwFlash > .01) { cx.fillStyle = `rgba(255,220,200,${.07 * fwFlash})`; cx.fillRect(0, 0, W, bY); fwFlash *= Math.exp(-dt * 5); }
  for (let i = rockets.length - 1; i >= 0; i--) {
    const k = rockets[i]; k.age += dt;
    const u = Math.min(1, k.age / k.dur), e = 1 - (1 - u) ** 2;
    const x = k.x0 + (k.tx - k.x0) * u + Math.sin(u * 9 + k.s) * 1.5 * U, y = k.y0 + (k.ty - k.y0) * e;
    k.trail.push(x, y); if (k.trail.length > 16) k.trail.splice(0, 2);
    cx.lineWidth = 1.6 * U; cx.lineCap = "round";
    cx.strokeStyle = "rgba(255,210,150,.55)"; cx.beginPath(); cx.moveTo(k.trail[0], k.trail[1]); for (let j = 2; j < k.trail.length; j += 2) cx.lineTo(k.trail[j], k.trail[j + 1]); cx.stroke();
    cx.fillStyle = "rgba(255,240,210,.95)"; cx.fillRect(x - 1.3 * U, y - 1.3 * U, 2.6 * U, 2.6 * U);
    const ry = water(y); if (ry) { cx.fillStyle = "rgba(255,220,170,.25)"; cx.fillRect(x - 1 * U + Math.sin(t * 7 + y) * U, ry, 2 * U, 4 * U); }
    if (u >= 1) { rockets.splice(i, 1); burst(k); }
  }
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i]; b.age += dt;
    const lk = b.age / b.life;
    if (lk >= 1) { fwParts -= b.n; bursts.splice(i, 1); continue; }
    if (b.age < .25) {                                                      // 터지는 순간 번쩍
      const g = cx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.R * 1.3); g.addColorStop(0, `rgba(${b.col},${.45 * (1 - b.age / .25)})`); g.addColorStop(1, `rgba(${b.col},0)`);
      cx.fillStyle = g; cx.fillRect(b.x - b.R * 1.3, b.y - b.R * 1.3, b.R * 2.6, b.R * 2.6);
    }
    const dr = Math.exp(-b.drag * dt), a = Math.min(1, 1.25 * (1 - lk) ** 1.1), tail = .06;
    // 같은 색끼리 한 번에 그린다(알갱이마다 stroke하면 폰에서 느려짐)
    const groups = new Map();
    for (const p of b.ps) {
      p.vx *= dr; p.vy = p.vy * dr + b.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (lk > .55 && Math.sin(t * 22 + p.tw * 40) > .4) continue;      // 끝무렵 반짝반짝
      let gp = groups.get(p.c); if (!gp) groups.set(p.c, gp = []); gp.push(p);
    }
    cx.lineWidth = (lk < .3 ? 2.8 : 2) * U;
    for (const [c, ps] of groups) {
      cx.strokeStyle = `rgba(${c},${a})`; cx.beginPath();
      for (const p of ps) { cx.moveTo(p.x, p.y); cx.lineTo(p.x - p.vx * tail, p.y - p.vy * tail); }
      cx.stroke();
      cx.fillStyle = `rgba(${c},${a * .3})`; cx.beginPath();
      for (const p of ps) { const ry = water(p.y); if (ry) cx.rect(p.x + Math.sin(t * 6 + ry * .3) * 1.5 * U - U, ry, 2 * U, 3.5 * U); }
      cx.fill();
    }
  }
  cx.globalCompositeOperation = "source-over";
}
// 조준: 내 캐릭터 머리 위로 터질 높이까지 점선과 동그라미
function drawAim(t) {
  const c = chars.get(me); if (!aiming || !c) return;
  const o = fwFrom(c), p = aim ? aim.p : 0, ty = fwApex(p);
  cx.strokeStyle = `rgba(243,217,164,${aim ? .8 : .35 + .2 * Math.sin(t * 4)})`; cx.lineWidth = 1.5 * U; cx.setLineDash([3 * U, 5 * U]);
  cx.beginPath(); cx.moveTo(o.x, o.y); cx.lineTo(o.x, aim ? ty : o.y - 40 * U); cx.stroke(); cx.setLineDash([]);
  if (aim) { cx.beginPath(); cx.arc(o.x, ty, (6 + 14 * p) * U, 0, TAU); cx.stroke(); }
}
function syncFwInfo() {
  const el = $("fwInfo");
  el.classList.toggle("on", aiming);
  const wait = Math.max(0, FW_GAP - (performance.now() - lastFwSent));
  el.textContent = aim ? `${Math.round(aim.p * 100)}% · 놓으면 쏴요` : `아래로 당겼다 놓기 · 오늘 ${fwToday}발`;
  const b = $("acts").querySelector("[data-fw]"); if (b) { b.classList.toggle("sel", aiming); b.classList.toggle("cool", wait > 0); }
}
function setAiming(on) {
  aiming = on; aim = null;
  cv.style.touchAction = on ? "none" : "manipulation";
  syncFwInfo();
}
cv.addEventListener("pointerdown", e => {
  if (!aiming) return;
  aim = { y0: e.clientY, p: 0, id: e.pointerId };
  try { cv.setPointerCapture(e.pointerId); } catch {}
  syncFwInfo();
});
cv.addEventListener("pointermove", e => {
  if (!aim || e.pointerId !== aim.id) return;
  aim.p = Math.max(0, Math.min(1, (e.clientY - aim.y0) / (H * .25)));
  syncFwInfo();
});
const fwRelease = e => {
  if (!aim || e.pointerId !== aim.id) return;
  const p = aim.p; aim = null;
  const c = chars.get(me);
  if (p < .06) { syncFwInfo(); return toast("화면을 아래로 쭉 당겼다가 놓아 보세요", 2200); }
  if (performance.now() - lastFwSent < FW_GAP) { syncFwInfo(); return toast("폭죽 준비 중이에요. 조금만 기다려요", 1500); }
  if (!c || c.state === "leave" || !ws || ws.readyState !== 1) { syncFwInfo(); return; }
  ws.send(JSON.stringify({ t: "fw", p }));
  lastFwSent = performance.now(); fwToday++;
  try { localStorage.setItem(FW_KEY, JSON.stringify({ d: today(), n: fwToday })); } catch {}
  syncFwInfo(); setTimeout(syncFwInfo, FW_GAP + 50);
};
cv.addEventListener("pointerup", fwRelease);
cv.addEventListener("pointercancel", e => { if (aim && e.pointerId === aim.id) { aim = null; syncFwInfo(); } });

// ---------- 루프 ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  const t = now / 1000;
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawScene(t, dt);
  drawFireworks(t, dt);
  const mine = chars.get(me), picking = canPick();
  const glowBase = !picking ? 0 : mine.state === "sit" ? .2 : .6;
  seats.forEach((s, i) => drawMat(s, glowBase && !seatTaken(i) ? glowBase + glowBase * .6 * Math.sin(t * 2.6 + i * .7) : 0));
  for (const c of chars.values()) stepChar(c, dt);
  [...chars.values()].sort((a, b) => a.y - b.y).forEach(c => drawChar(c, t));
  drawAim(t);
  cx.drawImage(vignette, 0, 0, W, H);
  requestAnimationFrame(frame);
}

// ---------- 실시간 연결 ----------
let ws, retry = 0, pingT, emojis = [];
function toast(msg, ms) { const el = $("toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(toast.t); if (ms) toast.t = setTimeout(() => el.classList.remove("on"), ms); }
function roomLabel(no) { return ROOM_NAMES[(no - 1) % ROOM_NAMES.length] + " " + String(Math.ceil(no / ROOM_NAMES.length)).padStart(2, "0"); }

function connect() {
  const from = (/[?&]from=([\w-]{1,20})/.exec(location.search) || [])[1];   // 어디서 왔는지(?from=kakao 등) 통계용
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws" + (from ? "?from=" + from : ""));
  ws.onopen = () => { retry = 0; $("toast").classList.remove("on"); clearInterval(pingT); pingT = setInterval(() => ws.readyState === 1 && ws.send('{"t":"p"}'), 25000); };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.t === "init") {
      chars.clear(); me = m.you; hinted = false;
      $("roomName").textContent = roomLabel(m.room);
      for (const u of m.users) addChar(u, u.id === me);
      $("cnt").textContent = m.users.length;
      if (!emojis.length) { buildEmoji(m.emojis); buildActs(); }
      syncActs();
    } else if (m.t === "join") addChar(m.user, true);
    else if (m.t === "seat") goSeat(m.id, m.seat);
    else if (m.t === "taken") toast("앗, 방금 다른 분이 먼저 앉았어요", 2500);
    else if (m.t === "leave") removeChar(m.id);
    else if (m.t === "emo") { const c = chars.get(m.id); if (c && c.emo.length < 4) { c.emo.push({ e: m.e, at: performance.now() }); if (m.e === "👋") c.waveUntil = performance.now() + 2400; } }
    else if (m.t === "fw") launchFw(m);
    else if (m.t === "act") { const c = chars.get(m.id); if (c) c.act = m.a; }
    else if (m.t === "count") $("cnt").textContent = m.room;
    else if (m.t === "full") { toast(m.why === "ip" ? "이 기기에서 너무 많이 접속했어요" : "지금 모든 강변이 꽉 찼어요", 0); retry = 99; }
  };
  ws.onclose = () => {
    clearInterval(pingT);
    if (retry >= 99) return;
    for (const c of chars.values()) if (c.id !== me) chars.delete(c.id);
    toast("연결이 끊겨서 다시 연결하고 있어요", 0);
    setTimeout(connect, Math.min(15000, 1000 * 2 ** retry++));
  };
}

// 돗자리 위 행동 (server.js ACTS와 같아야 함). 같은 걸 다시 누르면 그냥 앉기로
const ACTS = [["sit", "🧘", "앉기"], ["lie", "🛌", "눕기"], ["star", "🌟", "별 보기"], ["ramen", "🍜", "라면"], ["chicken", "🍗", "치킨"], ["photo", "📸", "사진"], ["stretch", "🙆", "기지개"], ["doze", "😪", "꾸벅"]];
function buildActs() {
  const bar = $("acts");
  const eb = document.createElement("button"); eb.innerHTML = "😊<span>이모지</span>"; eb.onclick = () => { if ($("emo").classList.toggle("open") && aiming) setAiming(false); };
  bar.appendChild(eb);
  const fb = document.createElement("button"); fb.dataset.fw = 1; fb.innerHTML = "🎆<span>폭죽</span>"; fb.setAttribute("aria-label", "폭죽");
  fb.onclick = () => {
    const c = chars.get(me);
    if (!aiming && (!c || c.state === "leave")) return;
    setAiming(!aiming); $("emo").classList.remove("open");
  };
  bar.appendChild(fb);
  const sep = document.createElement("div"); sep.className = "sep"; bar.appendChild(sep);
  for (const [id, icon, name] of ACTS) {
    const b = document.createElement("button"); b.dataset.act = id; b.innerHTML = `${icon}<span>${name}</span>`; b.setAttribute("aria-label", name);
    b.onclick = () => {
      const c = chars.get(me);
      if (!c || c.state !== "sit" && !(c.state === "walk" && c.then === "sit")) return toast("먼저 빈 돗자리를 눌러 앉아 주세요", 2500);
      const a = c.act === id ? "sit" : id;
      c.act = a; syncActs();
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: "act", a }));
    };
    bar.appendChild(b);
  }
  bar.classList.add("on"); syncActs();
  const more = () => bar.classList.toggle("more", bar.scrollWidth - bar.clientWidth - bar.scrollLeft > 4);   // 오른쪽에 버튼이 더 있으면 흐리게
  bar.addEventListener("scroll", more); addEventListener("resize", more); more();
}
function syncActs() { const c = chars.get(me), a = c ? c.act : "sit"; $("acts").querySelectorAll("button[data-act]").forEach(b => b.classList.toggle("sel", b.dataset.act === a)); }
function buildEmoji(list) {
  emojis = list; const bar = $("emo");
  for (const e of list) {
    const b = document.createElement("button"); b.textContent = e; b.setAttribute("aria-label", e);
    b.onclick = () => {
      if (bar.dataset.cool) return;
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: "emo", e }));
      const c = chars.get(me); if (c) { c.emo.push({ e, at: performance.now() }); if (e === "👋") c.waveUntil = performance.now() + 2400; }
      $("emo").classList.remove("open");
      bar.dataset.cool = 1; bar.querySelectorAll("button").forEach(x => x.classList.add("cool"));
      setTimeout(() => { delete bar.dataset.cool; bar.querySelectorAll("button").forEach(x => x.classList.remove("cool")); }, 1300);
    };
    bar.appendChild(b);
  }
}

// ---------- 소리 ----------
// 실제 녹음 3개를 따로 반복 재생하고(출처는 README), 각각 켜고 끄고 크기를 고른다.
// 크기는 Web Audio 게인으로 조절한다(아이폰은 audio.volume을 무시하므로). 파일은 켠 것만 내려받는다.
// 파일은 모두 -24 LUFS로 맞춰 두었고, 기본값(전체 60, 강물 70)이면 약 -39 LUFS로 아주 작게 나온다.
const TRACKS = [
  { id: "river", name: "🌊 강물", vol: 60, on: true },
  { id: "city", name: "🏙️ 도시", vol: 35, on: false },
  { id: "crick", name: "🦗 풀벌레", vol: 35, on: false },
];
const SND = { master: 60, power: true };
try { const v = JSON.parse(localStorage.getItem("hn-sound2") || "null"); if (v) { SND.master = v.master; SND.power = v.power; TRACKS.forEach(t => { if (v[t.id]) { t.vol = v[t.id].vol; t.on = v[t.id].on; } }); } } catch {}
function saveSnd() { try { const v = { master: SND.master, power: SND.power }; TRACKS.forEach(t => v[t.id] = { vol: t.vol, on: t.on }); localStorage.setItem("hn-sound2", JSON.stringify(v)); } catch {} }
let actx = null, masterGain = null, started = false, hasSound = false;
const curve = v => (v / 100) ** 2;
function ensureCtx() {
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC(); masterGain = actx.createGain(); masterGain.connect(actx.destination);
}
function applySound() {
  if (!started || !hasSound) return;
  if (actx && actx.state === "suspended") actx.resume();
  if (masterGain) masterGain.gain.value = curve(SND.master);
  for (const t of TRACKS) {
    const play = SND.power && t.on;
    if (play && !t.el) {
      t.el = new Audio("amb-" + t.id + ".mp3?v=2"); t.el.loop = true;
      if (actx) { t.gain = actx.createGain(); actx.createMediaElementSource(t.el).connect(t.gain); t.gain.connect(masterGain); }
    }
    if (!t.el) continue;
    if (t.gain) t.gain.gain.value = curve(t.vol); else t.el.volume = Math.min(1, curve(t.vol) * curve(SND.master));
    play ? t.el.play().catch(() => {}) : t.el.pause();
  }
  $("snd").textContent = SND.power && TRACKS.some(t => t.on) ? "🔊" : "🔈";
  saveSnd();
}
function buildMixer() {
  $("mxMaster").value = SND.master;
  $("mxMaster").oninput = e => { SND.master = +e.target.value; applySound(); };
  const pw = $("mxPower");
  const syncPower = () => { pw.classList.toggle("on", SND.power); pw.textContent = SND.power ? "켜짐" : "꺼짐"; };
  pw.onclick = () => { SND.power = !SND.power; syncPower(); applySound(); };
  syncPower();
  for (const t of TRACKS) {
    const row = document.createElement("div"); row.className = "row";
    const b = document.createElement("button"), r = document.createElement("input");
    b.textContent = t.name; r.type = "range"; r.min = 0; r.max = 100; r.value = t.vol; r.setAttribute("aria-label", t.name + " 크기");
    const sync = () => { b.classList.toggle("on", t.on); r.disabled = !t.on; };
    b.onclick = () => { t.on = !t.on; sync(); applySound(); };
    r.oninput = () => { t.vol = +r.value; applySound(); };
    sync(); row.append(b, r); $("mxTracks").appendChild(row);
  }
}
buildMixer();
$("snd").onclick = () => $("mixer").classList.toggle("on");
cv.addEventListener("pointerdown", () => { $("mixer").classList.remove("on"); $("emo").classList.remove("open"); });
$("snd").style.display = "none";
fetch("amb-river.mp3", { method: "HEAD" }).then(r => {
  if (!r.ok) return;
  hasSound = true; $("snd").style.display = "";
  $("soundNote").textContent = "밤 강변 소리가 작게 나와요(오른쪽 위에서 조절). 말은 못 하고 이모지만 보낼 수 있어요.";
}).catch(() => {});

$("go").onclick = () => {
  $("gate").classList.add("off");
  ensureCtx(); started = true; applySound();
  if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: "밤 한강 돗자리", artist: "밤 강변 소리" });
  connect();
};
fetch("/stats").then(r => r.json()).then(s => { if (s.total) $("gateMsg").innerHTML = `지금 <b>${s.total}명</b>이 한강에 나와 있어요.<br>여기 있는 사람들은 모두 지금 접속한 사람이에요.`; }).catch(() => {});

addEventListener("resize", layout);
layout();
requestAnimationFrame(frame);
</script>
