<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>소원 우체통 · 운영자</title>
<style>
  :root { --ink: #eef1f8; --dim: rgba(238,241,248,.6); --line: rgba(255,255,255,.12); --gold: #f5c84c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b1028; color: var(--ink); font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; } h1 span { color: var(--gold); }
  p.sub { color: var(--dim); font-size: 13px; margin: 0 0 18px; line-height: 1.5; }
  .row { display: flex; gap: 8px; margin-bottom: 16px; }
  input { flex: 1; min-width: 0; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--ink); font-size: 16px; }
  button { padding: 0 16px; border-radius: 12px; border: 0; background: var(--gold); color: #1b1a22; font-weight: 700; font-size: 15px; cursor: pointer; min-height: 44px; }
  .item { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; background: rgba(255,255,255,.03); }
  .meta { color: var(--dim); font-size: 12px; margin-bottom: 6px; }
  .text { white-space: pre-wrap; word-break: break-word; line-height: 1.55; }
  .note { color: var(--dim); font-size: 13px; }
  a { color: var(--gold); }
</style>
</head>
<body>
<main>
  <h1>💌 소원 우체통 <span>운영자</span></h1>
  <p class="sub">사람들이 우체통에 넣은 편지예요. 운영자 키가 있어야 보여요. 한 번 본 편지는 이 폰에도 보관돼서, 서버가 재시작돼도 남아 있어요.</p>
  <div class="row" id="keyRow"><input id="key" type="password" placeholder="운영자 키" autocomplete="off"><button id="open">보기</button></div>
  <div class="row"><button id="reload" style="display:none">새로고침</button></div>
  <p class="note" id="note"></p>
  <div id="list"></div>
  <p class="note"><a href="/">← 한강으로 돌아가기</a></p>
</main>
<script>
const $ = id => document.getElementById(id);
let key = ""; try { key = localStorage.getItem("hn-admin") || ""; } catch {}
// 서버 목록을 이 폰 사본(hn-letters, 게임 화면 편지함과 공유)에 합친다. 무료 서버는 재시작하면 파일이 지워지므로
function cacheLetters(list) {
  let all = []; try { all = JSON.parse(localStorage.getItem("hn-letters") || "[]"); } catch {}
  const seen = new Set(all.map(f => f.id || f.at + f.text));
  for (const f of list) { const k = f.id || f.at + f.text; if (!seen.has(k)) { seen.add(k); all.push(f); } }
  all.sort((a, b) => a.at < b.at ? 1 : -1); try { localStorage.setItem("hn-letters", JSON.stringify(all.slice(0, 1000))); } catch {}
  return all;
}
async function load() {
  $("note").textContent = "불러오는 중…";
  const r = await fetch("/admin/feedback", { headers: { "x-admin-key": key } }).catch(() => null);
  if (!r || !r.ok) { $("note").textContent = r && r.status === 403 ? "키가 맞지 않아요." : "불러오지 못했어요. 잠시 뒤 다시 해 주세요."; $("keyRow").style.display = ""; return; }
  try { localStorage.setItem("hn-admin", key); } catch {}
  $("keyRow").style.display = "none"; $("reload").style.display = "";
  const all = cacheLetters((await r.json()).items), items = all;
  $("note").textContent = `편지 ${items.length}통 (이 폰에도 보관돼요)`;
  const list = $("list"); list.textContent = "";
  for (const f of items) {
    const d = document.createElement("div"); d.className = "item";
    const m = document.createElement("div"); m.className = "meta";
    m.textContent = `${new Date(f.at).toLocaleString("ko-KR", { timeZone: "Asia/Seoul", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })} · ${f.nick} · ${f.room}번 방`;
    const t = document.createElement("div"); t.className = "text"; t.textContent = f.text;
    d.append(m, t); list.appendChild(d);
  }
  if (!items.length) $("note").textContent += " · 아직 없어요";
}
$("open").onclick = () => { key = $("key").value.trim(); if (key) load(); };
$("key").addEventListener("keydown", e => { if (e.key === "Enter") $("open").click(); });
$("reload").onclick = load;
if (key) load();
</script>
</body>
</html>
